<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t1">
  <title id="t1">UV curing and ink layer stack</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B1A17" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="uvray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5C26" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7A5C26" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A6322A"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#grid)"/>

  <!-- UV lamp head -->
  <g stroke="#1B1A17" stroke-width="1.4" fill="none">
    <rect x="300" y="34" width="200" height="46" rx="3"/>
    <path d="M318 80v14M482 80v14"/>
    <rect x="330" y="94" width="140" height="12" rx="2" fill="#2F5D62" fill-opacity=".16"/>
  </g>
  <text x="400" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#1B1A17">UV LED · 395 nm</text>
  <text x="400" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="1.4" fill="#7A7267">CURED BETWEEN PASSES</text>

  <!-- rays -->
  <path d="M340 106h120l72 130H268z" fill="url(#uvray)"/>
  <g stroke="#7A5C26" stroke-width="1" stroke-opacity=".55">
    <path d="M336 112l-58 118M368 112l-30 118M400 112v122M432 112l30 118M464 112l58 118"/>
  </g>

  <!-- layer stack -->
  <g font-family="Inter, Arial, sans-serif">
    <!-- varnish -->
    <rect x="150" y="252" width="500" height="18" fill="#C9B382" fill-opacity=".35" stroke="#7A5C26" stroke-width="1.1"/>
    <text x="664" y="266" font-size="11" fill="#7A5C26">Varnish</text>
    <!-- colour -->
    <rect x="150" y="270" width="500" height="22" fill="#A6322A" fill-opacity=".55" stroke="#A6322A" stroke-width="1.1"/>
    <text x="664" y="286" font-size="11" fill="#A6322A">CMYK + Lc Lm</text>
    <!-- white -->
    <rect x="150" y="292" width="500" height="26" fill="#F4EEE2" stroke="#1B1A17" stroke-width="1.2"/>
    <text x="664" y="310" font-size="11" fill="#45403A">White ink</text>
    <!-- primer -->
    <rect x="150" y="318" width="500" height="12" fill="#2F5D62" fill-opacity=".28" stroke="#2F5D62" stroke-width="1.1"/>
    <text x="664" y="329" font-size="11" fill="#2F5D62">Primer</text>
    <!-- substrate -->
    <rect x="150" y="330" width="500" height="34" fill="#EBE2D1" stroke="#1B1A17" stroke-width="1.4"/>
    <text x="664" y="352" font-size="11" fill="#45403A">Substrate</text>
  </g>

  <!-- thickness callout -->
  <g stroke="#1B1A17" stroke-width="1" fill="none">
    <path d="M128 252h14M128 364h14M135 252v112" stroke-dasharray="3 4"/>
  </g>
  <text x="112" y="312" font-size="10" fill="#7A7267" font-family="Inter, Arial, sans-serif" transform="rotate(-90 112 312)" text-anchor="middle">film varies</text>

  <!-- cure ticks -->
  <g fill="none" stroke="#2F5D62" stroke-width="1.3">
    <path d="M120 261l6 6 10-11M120 281l6 6 10-11M120 305l6 6 10-11M120 324l6 6 10-11"/>
  </g>
  <text x="400" y="404" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#7A7267" font-family="Inter, Arial, sans-serif">FIG. 02 · CURE EACH LAYER BEFORE THE NEXT PASS</text>
</svg>
