<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t5">
  <title id="t5">360 degree cylinder printing with a rotary fixture</title>
  <defs>
    <pattern id="g5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B1A17" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A6322A"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#g5)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#45403A">

    <!-- head above -->
    <g stroke="#1B1A17" stroke-width="1.3" fill="#F9F5EC">
      <rect x="300" y="42" width="200" height="34" rx="2"/>
    </g>
    <text x="400" y="64" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#1B1A17">PRINTHEAD · INDEXED</text>

    <!-- cup on rotary jig -->
    <g transform="translate(400,250)">
      <!-- jig -->
      <rect x="-120" y="70" width="240" height="26" rx="3" fill="#EBE2D1" stroke="#1B1A17" stroke-width="1.3"/>
      <!-- cup body (side view, tapered) -->
      <path d="M-62-60h124l-14 120h-96z" fill="#F9F5EC" stroke="#1B1A17" stroke-width="1.4"/>
      <!-- printed band -->
      <path d="M-55-20h110l-8 62h-94z" fill="#A6322A" fill-opacity=".35" stroke="#A6322A" stroke-width="1"/>
      <!-- rotation arrow -->
      <path d="M-92 0a92 92 0 0 1 20-46" fill="none" stroke="#A6322A" stroke-width="1.4" marker-end="url(#a5)"/>
      <path d="M92 0a92 92 0 0 0-20 46" fill="none" stroke="#A6322A" stroke-width="1.4" marker-end="url(#a5)"/>
      <text x="0" y="-96" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#2F5D62">360° ROTATION</text>
    </g>

    <!-- dimension annotations -->
    <g stroke="#1B1A17" stroke-width="1" fill="none">
      <path d="M250 190h-26M250 310h-26M237 190v120"/>
      <path d="M338 340h124M338 352h124"/>
      <path d="M338 340v10M400 340v10M462 340v10"/>
    </g>
    <text x="228" y="250" font-size="10" fill="#7A7267" transform="rotate(-90 228 250)" text-anchor="middle">print height</text>
    <text x="400" y="376" font-size="10" fill="#7A7267" text-anchor="middle">diameter range · fixture sets the gap</text>

    <!-- right panel: why it works -->
    <g transform="translate(540,120)">
      <text x="0" y="0" font-size="10" letter-spacing="1.4" fill="#7A7267">THE TRADE-OFF</text>
      <g font-size="11" fill="#45403A">
        <text x="0" y="26">· nozzle stays perpendicular to surface</text>
        <text x="0" y="48">· step = one rotation increment</text>
        <text x="0" y="70">· taper needs a tilting fixture</text>
        <text x="0" y="92">· seam is hidden by overlap</text>
      </g>
      <g stroke="#2F5D62" stroke-width="1" fill="none">
        <path d="M0 108h230"/>
      </g>
      <text x="0" y="132" font-size="10" fill="#7A7267">Measure at both ends of the print band,</text>
      <text x="0" y="150" font-size="10" fill="#7A7267">not at the rim.</text>
    </g>

    <text x="60" y="424" font-size="10" letter-spacing="1.6" fill="#7A7267">FIG. 05 · ROTARY PRINTING IS A HEIGHT AND INDEXING PROBLEM</text>
  </g>
</svg>
