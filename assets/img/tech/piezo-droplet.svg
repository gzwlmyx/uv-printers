<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t2">
  <title id="t2">Piezo printhead droplet formation</title>
  <defs>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B1A17" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A6322A"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#g2)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#45403A">

    <!-- three stages -->
    <g>
      <!-- stage 1 idle -->
      <g transform="translate(30,80)">
        <rect x="20" y="0" width="200" height="54" rx="3" fill="#F9F5EC" stroke="#1B1A17" stroke-width="1.3"/>
        <rect x="36" y="10" width="168" height="12" rx="2" fill="#2F5D62" fill-opacity=".3" stroke="#2F5D62"/>
        <path d="M36 22v22h168V22" fill="#EBE2D1" stroke="#1B1A17" stroke-width="1.2"/>
        <path d="M110 44v26h20V44" fill="#F4EEE2" stroke="#1B1A17" stroke-width="1.2"/>
        <path d="M112 70h16" stroke="#1B1A17" stroke-width="3"/>
        <text x="120" y="112" text-anchor="middle" font-size="10" fill="#7A7267">1 · IDLE</text>
      </g>
      <!-- stage 2 fire -->
      <g transform="translate(285,80)">
        <rect x="20" y="0" width="200" height="54" rx="3" fill="#F9F5EC" stroke="#1B1A17" stroke-width="1.3"/>
        <path d="M36 10h168l-10 12H46z" fill="#2F5D62" fill-opacity=".45" stroke="#2F5D62"/>
        <path d="M36 22c0 16 22 22 84 22s84-6 84-22" fill="#EBE2D1" stroke="#1B1A17" stroke-width="1.2"/>
        <path d="M110 44v26h20V44" fill="#F4EEE2" stroke="#1B1A17" stroke-width="1.2"/>
        <!-- droplet -->
        <path d="M120 74c-7 10-12 16-12 22a12 12 0 0 0 24 0c0-6-5-12-12-22z" fill="#2F5D62"/>
        <text x="120" y="112" text-anchor="middle" font-size="10" fill="#7A7267">2 · VOLTAGE APPLIED</text>
        <path d="M120 10v-2" stroke="#A6322A" stroke-width="1.4" marker-end="url(#a2)"/>
      </g>
      <!-- stage 3 refill -->
      <g transform="translate(540,80)">
        <rect x="20" y="0" width="200" height="54" rx="3" fill="#F9F5EC" stroke="#1B1A17" stroke-width="1.3"/>
        <rect x="36" y="10" width="168" height="12" rx="2" fill="#2F5D62" fill-opacity=".3" stroke="#2F5D62"/>
        <path d="M36 22v22h168V22" fill="#EBE2D1" stroke="#1B1A17" stroke-width="1.2"/>
        <path d="M110 44v26h20V44" fill="#F4EEE2" stroke="#1B1A17" stroke-width="1.2"/>
        <path d="M120 152c-8 12-14 20-14 27a14 14 0 0 0 28 0c0-7-6-15-14-27z" fill="#2F5D62" fill-opacity=".85"/>
        <path d="M120 150v-24" stroke="#A6322A" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#a2)"/>
        <text x="120" y="112" text-anchor="middle" font-size="10" fill="#7A7267">3 · REFILL</text>
      </g>
    </g>

    <!-- waveform strip -->
    <g transform="translate(30,318)" stroke="#A6322A" stroke-width="1.2" fill="none">
      <rect x="0" y="-14" width="740" height="76" fill="#F9F5EC" stroke="#1B1A17" stroke-opacity=".25" stroke-width="1"/>
      <path d="M10 20h90l14-16 14 32 14-16h70l14-10 14 20 14-10h70l14-4 14 8 14-4h70l14-2 14 4 14-2h70l14-1 14 2 14-1h80"/>
    </g>
    <g font-size="10" fill="#7A7267" font-family="Inter, Arial, sans-serif">
      <rect x="30" y="352" width="18" height="8" fill="#2F5D62" fill-opacity=".35" stroke="#2F5D62"/>
      <text x="56" y="360">piezo element (top bar)</text>
      <rect x="220" y="352" width="18" height="8" fill="#EBE2D1" stroke="#1B1A17"/>
      <text x="246" y="360">ink chamber</text>
      <rect x="410" y="352" width="18" height="8" fill="#F4EEE2" stroke="#1B1A17"/>
      <text x="436" y="360">nozzle plate</text>
      <text x="600" y="360" fill="#A6322A">droplet: 3.8–12.5 pl</text>
    </g>
    <text x="30" y="404" font-size="10" letter-spacing="1.6" fill="#7A7267">FIG. 01 · A PIEZO HEAD FIRES BY DEFORMING THE CHAMBER, NOT BY HEATING INK</text>
    <text x="712" y="314" text-anchor="end" font-size="10" fill="#A6322A">drive waveform</text>
  </g>
</svg>
