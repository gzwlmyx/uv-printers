<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t3">
  <title id="t3">Pass lines and banding in solid fills</title>
  <defs>
    <pattern id="g3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B1A17" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="fill" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2F5D62" fill-opacity=".28"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1B1A17"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#g3)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#45403A">

    <!-- head + passes -->
    <text x="40" y="52" font-size="10" letter-spacing="1.6" fill="#7A7267">HEAD WIDTH = ONE PASS</text>
    <g stroke="#1B1A17" stroke-width="1.3" fill="#F9F5EC">
      <rect x="40" y="64" width="260" height="26" rx="2"/>
      <rect x="40" y="64" width="260" height="26" rx="2" fill="none" stroke="#A6322A" stroke-dasharray="4 4"/>
    </g>
    <text x="170" y="82" text-anchor="middle" font-size="10" fill="#A6322A">printhead car</text>
    <path d="M330 77h70" stroke="#1B1A17" stroke-width="1.2" marker-end="url(#a3)"/>
    <text x="345" y="66" font-size="10" fill="#7A7267">step</text>

    <!-- three printed strips -->
    <g>
      <rect x="40" y="130" width="720" height="52" fill="url(#fill)" stroke="#2F5D62" stroke-opacity=".5"/>
      <rect x="40" y="182" width="720" height="52" fill="url(#fill)" stroke="#2F5D62" stroke-opacity=".5"/>
      <rect x="40" y="234" width="720" height="52" fill="url(#fill)" stroke="#2F5D62" stroke-opacity=".5"/>
      <!-- dark overlap band -->
      <rect x="40" y="182" width="720" height="6" fill="#1B1A17" fill-opacity=".45"/>
      <!-- light gap band -->
      <rect x="40" y="234" width="720" height="5" fill="#F4EEE2"/>
      <g stroke="#A6322A" stroke-width="1.4" fill="none">
        <path d="M760 188h20M760 236h20"/>
      </g>
      <text x="788" y="196" font-size="10" text-anchor="end" fill="#A6322A">overlap → dark line</text>
      <text x="788" y="252" font-size="10" text-anchor="end" fill="#A6322A">gap → light line</text>
    </g>

    <!-- annotations left -->
    <g stroke="#1B1A17" stroke-width="1" fill="none" stroke-dasharray="3 4">
      <path d="M28 130v52M28 182v52M28 234v52"/>
    </g>
    <text x="20" y="158" font-size="10" fill="#7A7267" transform="rotate(-90 20 158)" text-anchor="middle">pass 1</text>
    <text x="20" y="210" font-size="10" fill="#7A7267" transform="rotate(-90 20 210)" text-anchor="middle">pass 2</text>
    <text x="20" y="262" font-size="10" fill="#7A7267" transform="rotate(-90 20 262)" text-anchor="middle">pass 3</text>

    <!-- fix row -->
    <g transform="translate(40,322)">
      <text x="0" y="0" font-size="10" letter-spacing="1.4" fill="#7A7267">WHEN THE STEP IS INCONSISTENT</text>
      <g font-size="11" fill="#45403A">
        <text x="0" y="26">1. nozzle check · 2. bidirectional alignment · 3. media height map · 4. feathering on the edges · 5. reduce pass overlap</text>
      </g>
      <g stroke="#2F5D62" stroke-width="1.3" fill="none">
        <path d="M0 36h720"/>
      </g>
      <text x="0" y="60" font-size="10" fill="#7A7267">A consistent step error repeats every pass; a random one is usually media or vacuum.</text>
    </g>
    <text x="40" y="424" font-size="10" letter-spacing="1.6" fill="#7A7267">FIG. 03 · PASS LINES ARE A GEOMETRY PROBLEM BEFORE THEY ARE AN INK PROBLEM</text>
  </g>
</svg>
